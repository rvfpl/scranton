<style>
    .cityloop {
        position: relative;
        width: 100%;
        max-width: var(--cl-max, 720px);
        aspect-ratio: 1/1;
        overflow: hidden;
        background: #FFD60A;
        margin: 0 auto
    }

    .cityloop svg.cl-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        will-change: transform
    }

    .cityloop svg.cl-s1 {
        animation: cl-push 9s linear -.5s infinite
    }

    .cityloop svg.cl-s2 {
        animation: cl-push 9s linear -6.5s infinite
    }

    .cityloop svg.cl-s3 {
        animation: cl-push 9s linear -3.5s infinite
    }

    .cityloop .cl-t {
        font-family: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900
    }

    @keyframes cl-push {
        0% {
            transform: translateX(100%);
            animation-timing-function: cubic-bezier(.65, 0, .35, 1)
        }

        5.556% {
            transform: translateX(0);
            animation-timing-function: linear
        }

        33.333% {
            transform: translateX(0);
            animation-timing-function: cubic-bezier(.65, 0, .35, 1)
        }

        38.889% {
            transform: translateX(-100%)
        }

        100% {
            transform: translateX(-100%)
        }
    }

    .cityloop .cl-taxi {
        animation: cl-taxi 3s linear infinite
    }

    @keyframes cl-taxi {
        from {
            transform: translateX(-400px)
        }

        to {
            transform: translateX(1500px)
        }
    }

    .cityloop .cl-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: cl-spin .36s linear infinite
    }

    @keyframes cl-spin {
        to {
            transform: rotate(360deg)
        }
    }

    .cityloop .cl-dashes {
        animation: cl-dash .53s linear infinite
    }

    @keyframes cl-dash {
        to {
            transform: translateX(-170px)
        }
    }

    .cityloop .cl-ball {
        animation: cl-ball 1.5s linear infinite
    }

    @keyframes cl-ball {
        0% {
            transform: translate(790px, 790px)
        }

        3.3% {
            transform: translate(800.3px, 742.8px)

    .cityloop .cl-bob {
        animation: cl-bob 1.2s ease-in-out infinite alternate
    }

    @keyframes cl-bob {
        from {
            transform: translateY(-6px)
        }

        to {
            transform: translateY(6px)
        }
    }

    .cityloop .cl-bobsmall {
        animation: cl-bob .9s ease-in-out infinite alternate
    }

    .cityloop .cl-wave-a {
        animation: cl-wave 3s linear infinite
    }

    .cityloop .cl-wave-b {
        animation: cl-wave 3s linear infinite reverse
    }

    @keyframes cl-wave {
        to {
            transform: translateX(-264px)
        }
    }

    .cityloop .cl-fog {
        animation: cl-fog 32s linear infinite
    }

    @keyframes cl-fog {
        from {
            transform: translateX(-350px)
        }

        }
    }

    .cityloop .cl-sail {

    }

    @keyframes cl-sail {
        from {

        }

        to {
            transform: translateX(1200px)
        }
    }

    .cityloop .cl-canoe {

    }

    @keyframes cl-canoe {

        }

        to {

        }
    }

    .cityloop .cl-drift {

    }

        }

        }

    .cityloop .cl-sway {
        transform-box: fill-box;
        transform-origin: center;
        animation: cl-sway 1.8s ease-in-out infinite alternate
    }

    @keyframes cl-sway {
        from {
            transform: translateY(-10px) rotate(-25deg)
        }

        to {
            transform: translateY(10px) rotate(25deg)
        }
    }

    @media (prefers-reduced-motion:reduce) {

        .cityloop svg.cl-scene,
        .cityloop svg.cl-scene * {
            animation: none !important
        }

        .cityloop svg.cl-s1 {
            transform: none
        }

        .cityloop svg.cl-s2,
        .cityloop svg.cl-s3 {

        }

            transform: translateX(540px)
        }

            transform: translate(875px, 560px)
        }
